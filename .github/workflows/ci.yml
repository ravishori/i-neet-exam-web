name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "22"

jobs:
  backend-lint:
    name: Backend / Lint (ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: ruff check (blocking)
        run: ruff check app/
      - name: ASYNC blocking-call findings (informational only, does not fail the build)
        # 5 pre-existing findings (open()/pathlib.Path in async handlers) predate this
        # pipeline and are out of scope for a CI/CD-only change — see pyproject.toml
        # and docs/deploy/TEST_REPORT.md. Tracked as a fast-follow, not a gate.
        run: ruff check app/ --select ASYNC || true

  backend-test:
    name: Backend / Tests
    runs-on: ubuntu-latest
    needs: backend-lint
    defaults:
      run:
        working-directory: apps/backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://trinetra_app:trinetra_dev_pw@localhost:5432/trinetra_test_db
      DATABASE_URL_SYNC: postgresql+psycopg://trinetra_app:trinetra_dev_pw@localhost:5432/trinetra_test_db
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-test-secret-not-for-any-real-environment-0123456789
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt

      - name: Create app roles + trinetra_test_db (mirrors database/init.sql, per ADR-0020)
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -c "CREATE ROLE trinetra_app LOGIN PASSWORD 'trinetra_dev_pw';"
          psql -h localhost -U postgres -c "CREATE DATABASE trinetra_test_db OWNER trinetra_app;"

      - name: Run migrations against trinetra_test_db
        run: alembic upgrade head

      - name: pytest
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: apps/backend/coverage.xml
          retention-days: 14

  frontend-lint-typecheck:
    name: Frontend / Lint + Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit

  frontend-test:
    name: Frontend / Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm test

  docker-build:
    name: Docker / Build images (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-lint-typecheck, frontend-test]
    strategy:
      matrix:
        include:
          - service: backend
            context: apps/backend
          - service: web
            context: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.service }} image (validation only — not pushed)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: false
          tags: trinetra-${{ matrix.service }}:ci-${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:8000
          outputs: type=docker,dest=/tmp/${{ matrix.service }}-image.tar
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@0.29.0
        with:
          input: /tmp/${{ matrix.service }}-image.tar
          format: table
          severity: CRITICAL,HIGH
          exit-code: "0"
      - uses: actions/upload-artifact@v4
        with:
          name: docker-image-${{ matrix.service }}
          path: /tmp/${{ matrix.service }}-image.tar
          retention-days: 3
