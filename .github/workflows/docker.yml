name: Docker Build & Security Scan

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read
  packages: write
  security-events: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:

  docker:

    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------------------------------------
      # Checkout Repository
      # ----------------------------------------------------------------------

      - name: Checkout Repository
        uses: actions/checkout@v4

      # ----------------------------------------------------------------------
      # Setup Docker Buildx
      # ----------------------------------------------------------------------

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # ----------------------------------------------------------------------
      # Login to GitHub Container Registry
      # ----------------------------------------------------------------------

      - name: Login to GHCR
        if: github.event_name != 'pull_request'

        uses: docker/login-action@v3

        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ----------------------------------------------------------------------
      # Build Backend Image
      # ----------------------------------------------------------------------

      - name: Build Backend Docker Image

        uses: docker/build-push-action@v6

        with:
          context: ./apps/backend
          file: ./apps/backend/Dockerfile
          push: false
          load: true
          tags: backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ----------------------------------------------------------------------
      # Build Frontend Image
      # ----------------------------------------------------------------------

      - name: Build Frontend Docker Image

        uses: docker/build-push-action@v6

        with:
          context: ./apps/frontend
          file: ./apps/frontend/Dockerfile
          push: false
          load: true
          tags: frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ----------------------------------------------------------------------
      # Scan Backend Image
      # ----------------------------------------------------------------------

      - name: Scan Backend Image

        uses: aquasecurity/trivy-action@0.28.0

        with:
          image-ref: backend:latest
          format: sarif
          output: backend-trivy.sarif
          severity: CRITICAL,HIGH

      # ----------------------------------------------------------------------
      # Scan Frontend Image
      # ----------------------------------------------------------------------

      - name: Scan Frontend Image

        uses: aquasecurity/trivy-action@0.28.0

        with:
          image-ref: frontend:latest
          format: sarif
          output: frontend-trivy.sarif
          severity: CRITICAL,HIGH

      # ----------------------------------------------------------------------
      # Upload Backend Security Report
      # ----------------------------------------------------------------------

      - name: Upload Backend SARIF

        uses: github/codeql-action/upload-sarif@v3

        with:
          sarif_file: backend-trivy.sarif

      # ----------------------------------------------------------------------
      # Upload Frontend Security Report
      # ----------------------------------------------------------------------

      - name: Upload Frontend SARIF

        uses: github/codeql-action/upload-sarif@v3

        with:
          sarif_file: frontend-trivy.sarif

      # ----------------------------------------------------------------------
      # Push Backend Image
      # ----------------------------------------------------------------------

      - name: Push Backend Image

        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

        uses: docker/build-push-action@v6

        with:
          context: ./apps/backend
          file: ./apps/backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:latest
            ghcr.io/${{ github.repository }}/backend:${{ github.sha }}

      # ----------------------------------------------------------------------
      # Push Frontend Image
      # ----------------------------------------------------------------------

      - name: Push Frontend Image

        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

        uses: docker/build-push-action@v6

        with:
          context: ./apps/frontend
          file: ./apps/frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/frontend:latest
            ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}